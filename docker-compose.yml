version: '3.8'

services:
  blivechat:
    image: xfgryujk/blivechat:latest
    container_name: blivechat
    ports:
      - "12450:12450"
    volumes:
      - blivechat-data:/mnt/data
      - ./plugin.json:/mnt/data/data/plugins/blivechat-tts/plugin.json
      - ./config.ini:/mnt/data/data/config.ini
      - ./signal:/tmp/signal
    environment:
      - SIGNAL_FILE_PATH=/tmp/signal/blivechat-tts.signal
      - BLC_HOST=localhost
    restart: unless-stopped

volumes:
  blivechat-data: